<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to The Paw Place 🐾</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #140d21 url('hero-background.png') center/cover no-repeat;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    #welcome-wrapper {
      position: relative;
      width: 100%;
      height: 100dvh;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(20,13,33,0.45), rgba(20,13,33,0.78));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #fff;
    }
    .content-box {
      max-width: 660px;
      animation: fadeUp 0.9s ease forwards;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.28);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(2.1rem, 7vw, 4rem);
      font-weight: 800;
      line-height: 1.12;
      margin-bottom: 16px;
      text-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    p {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: rgba(255,255,255,0.9);
      margin-bottom: 34px;
    }
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 46px;
      font-size: 1.12rem;
      font-weight: 800;
      background: #ff6b5b;
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255, 107, 91, 0.45);
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .enter-btn:hover {
      background: #e65242;
      transform: translateY(-3px) scale(1.03);
    }
    .fade-out { opacity: 0; transform: scale(1.06); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="welcome-wrapper">
    <video id="bg-video" autoplay muted loop playsinline poster="hero-background.png">
      <source src="your-video.mp4" type="video/mp4">
    </video>
    <div class="overlay">
      <div class="content-box">
        <div class="pill"><i class="fas fa-paw"></i> Alexandria Rescue & Pet Care</div>
        <h1>Welcome to The Paw Place 🐾</h1>
        <p>Where every rescued paw finds warmth, care, and a forever family.</p>
        <button id="enter-site" class="enter-btn">Enter The Paw Place <i class="fas fa-arrow-right"></i></button>
      </div>
    </div>
  </div>
  <script>
    const video = document.getElementById('bg-video');
    const btn = document.getElementById('enter-site');
    const wrapper = document.getElementById('welcome-wrapper');
    video.play().catch(() => {});
    btn.addEventListener('click', () => {
      wrapper.classList.add('fade-out');
      setTimeout(() => { window.location.href = 'index.html'; }, 650);
    });
  </script>
</body>
</html>
